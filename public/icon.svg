<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rounded square dark green background -->
  <rect width="100" height="100" rx="22" fill="#1E4632"/>
  
  <!-- Curved basket handle -->
  <path d="M 32 46 C 32 26, 68 26, 68 46" fill="none" stroke="#FAF7F0" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Small two-leaf sprout growing up from the apex of the handle -->
  <!-- Central sprout stem -->
  <path d="M 50 31 Q 50 20 50 17" fill="none" stroke="#FAF7F0" stroke-width="3" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M 50 24 C 44 23, 40 18, 44 14 C 49 14, 50 21, 50 24 Z" fill="#FAF7F0"/>
  <!-- Right leaf -->
  <path d="M 50 21 C 55 19, 61 14, 58 11 C 52 11, 50 18, 50 21 Z" fill="#D9A62E"/>
  
  <!-- Cream-colored trapezoid basket body -->
  <polygon points="24,44 76,44 69,76 31,76" fill="#FAF7F0"/>
  
  <!-- Subtle basket weave lines in dark green -->
  <path d="M 31 54 L 69 54" stroke="#1E4632" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 34 65 L 66 65" stroke="#1E4632" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 43 45 L 41 75" stroke="#1E4632" stroke-width="2.2" stroke-linecap="round" opacity="0.25"/>
  <path d="M 57 45 L 59 75" stroke="#1E4632" stroke-width="2.2" stroke-linecap="round" opacity="0.25"/>
</svg>
