<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="krowBg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E4632"/>
      <stop offset="100%" stop-color="#122F22"/>
    </linearGradient>
    <filter id="krowSoftDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1C14" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#krowBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2F6B4F" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Master Krōw Sprout Emblem -->
  <g filter="url(#krowSoftDrop)">
    <!-- Central Stem -->
    <path
      d="M256 416V208"
      stroke="#E8F2EC"
      stroke-width="36"
      stroke-linecap="round"
    />
    <!-- Left Leaf (Deep Sprout Green) -->
    <path
      d="M256 288C184 288 128 240 128 168C200 168 256 216 256 288Z"
      fill="#3FA369"
      stroke="#E8F2EC"
      stroke-width="24"
      stroke-linejoin="round"
    />
    <!-- Right Leaf (Fresh Sage Green) -->
    <path
      d="M256 240C256 168 312 120 384 120C384 192 328 240 256 240Z"
      fill="#6BC58D"
      stroke="#E8F2EC"
      stroke-width="24"
      stroke-linejoin="round"
    />
  </g>
</svg>
