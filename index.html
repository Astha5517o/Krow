    <!-- Environment & Font Loading Guards -->
    <script>
      (function() {
        // Suppress benign Vite WebSocket & HMR connection messages in sandboxed containers where DISABLE_HMR is set
        function isBenignViteMessage(args) {
          if (!args || args.length === 0) return false;
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (!arg) continue;
            if (typeof arg === 'string') {
              var lower = arg.toLowerCase();
              if (
                lower.indexOf('[vite]') !== -1 ||
                lower.indexOf('vite') === 0 ||
                lower.indexOf('failed to connect to websocket') !== -1 ||
                lower.indexOf('server connection lost') !== -1 ||
                lower.indexOf('websocket connection') !== -1 ||
                lower.indexOf('/@vite/client') !== -1
              ) {
                return true;
              }
            } else if (typeof arg === 'object') {
              var msg = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.reason || '');
              var lowerMsg = msg.toLowerCase();
              if (
                lowerMsg.indexOf('[vite]') !== -1 ||
                lowerMsg.indexOf('failed to connect to websocket') !== -1 ||
                lowerMsg.indexOf('websocket') !== -1
              ) {
                return true;
              }
            }
          }
          return false;
        }

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            if (isBenignViteMessage(arguments)) {
              return;
            }
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || '')) + '';
          var src = (e && (e.filename || '')) + '';
          if (
            msg.toLowerCase().indexOf('[vite]') !== -1 ||
            msg.toLowerCase().indexOf('websocket') !== -1 ||
            src.indexOf('@vite/client') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason))) + '';
          if (
            reason.toLowerCase().indexOf('[vite]') !== -1 ||
            reason.toLowerCase().indexOf('websocket') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        if ('fonts' in document) {
          Promise.race([
            document.fonts.load('24px "Material Symbols Outlined"'),
            new Promise(function(resolve) { setTimeout(resolve, 600); })
          ]).then(function() {
            document.documentElement.classList.add('fonts-loaded');
          }).catch(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
        } else {
          document.documentElement.classList.add('fonts-loaded');
        }
      })();
    </script>
